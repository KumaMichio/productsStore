name: Build & Deploy

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  BACKEND_IMAGE:  ${{ secrets.DOCKER_HUB_USERNAME }}/shopapp-spring
  FRONTEND_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/shopapp-frontend

jobs:
  # ── Job 1: Build & Test ──────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build backend (skip tests for speed — tests run in separate job)
        run: mvn package -DskipTests -q
        working-directory: backend

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Build frontend (production)
        run: npm run build -- --configuration=production
        working-directory: frontend

  # ── Job 2: Docker build & push (only on push to main) ────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: DockerfileJavaSpring
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: DockerfileAngular
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Job 3: Deploy to VPS ──────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker
    environment: production

    steps:
      - name: Checkout code (for docker-compose file)
        uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          source:   "docker-compose.prod.yml,nginx/"
          target:   "/opt/shopapp"

      - name: Pull new images & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/shopapp

            # Write .env from GitHub secrets (injected at deploy time)
            cat > .env << 'ENVEOF'
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_DATABASE=ShopApp
            SPRING_DATASOURCE_URL=jdbc:mysql://mysql8-container:3306/ShopApp?serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
            SPRING_PROFILES_ACTIVE=prod
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            REDIS_HOST=redis-container
            REDIS_PORT=6379
            KAFKA_BROKER_SERVER=kafka-broker-01
            KAFKA_BROKER_PORT=19092
            APP_IMAGE_BACKEND=${{ env.BACKEND_IMAGE }}
            APP_IMAGE_FRONTEND=${{ env.FRONTEND_IMAGE }}
            APP_VERSION=${{ github.sha }}
            DOMAIN=${{ secrets.DOMAIN }}
            ENVEOF

            # Pull latest images
            docker-compose -f docker-compose.prod.yml pull

            # Rolling restart (zero-downtime for stateless services)
            docker-compose -f docker-compose.prod.yml up -d --remove-orphans

            # Remove dangling images
            docker image prune -f
