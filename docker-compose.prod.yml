version: '3.8'

# Production compose — requires a .env file in the same directory.
# cp .env.example .env && fill in values before running.
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:

  # ── MySQL ──────────────────────────────────────────────────
  mysql8-container:
    image: mysql:8.2.0
    container_name: mysql8-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE:-ShopApp}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - shopapp-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 20s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis-container:
    image: redis:7.2-alpine
    container_name: redis-container
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shopapp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Spring Boot ────────────────────────────────────────────
  shopapp-spring-container:
    image: ${APP_IMAGE_BACKEND:-shopapp-spring}:${APP_VERSION:-latest}
    container_name: shopapp-spring-container
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      MYSQL_ROOT_PASSWORD:   ${MYSQL_ROOT_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JWT_SECRET_KEY:        ${JWT_SECRET_KEY}
      REDIS_HOST:            ${REDIS_HOST:-redis-container}
      REDIS_PORT:            ${REDIS_PORT:-6379}
      KAFKA_BROKER_SERVER:   ${KAFKA_BROKER_SERVER:-kafka-broker-01}
      KAFKA_BROKER_PORT:     ${KAFKA_BROKER_PORT:-19092}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql8-container:
        condition: service_healthy
      redis-container:
        condition: service_healthy
    networks:
      - shopapp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/api/v1/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Angular frontend ───────────────────────────────────────
  shopapp-frontend-container:
    image: ${APP_IMAGE_FRONTEND:-shopapp-frontend}:${APP_VERSION:-latest}
    container_name: shopapp-frontend-container
    restart: unless-stopped
    networks:
      - shopapp-network

  # ── Nginx reverse proxy ────────────────────────────────────
  nginx-container:
    image: nginx:1.25-alpine
    container_name: nginx-container
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - shopapp-spring-container
      - shopapp-frontend-container
    networks:
      - shopapp-network

  # ── Certbot (SSL — run once, then renews via cron) ─────────
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Usage: docker-compose run --rm certbot certonly --webroot
    #        --webroot-path /var/www/certbot -d yourdomain.com
    profiles:
      - ssl

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  certbot_www:
  certbot_conf:

networks:
  shopapp-network:
    name: shopapp-network
    driver: bridge
