<app-header></app-header>

<main class="contact-page">
  <header class="contact-head">
    <h1 class="contact-title">Liên hệ</h1>
    <p class="contact-intro">Có câu hỏi về sản phẩm, đơn hàng hay hợp tác? Gửi cho chúng tôi vài dòng.</p>
  </header>

  <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="submit()">
    <div class="field">
      <label class="field-label">Họ tên</label>
      <input class="field-input" type="text" formControlName="name" placeholder="Tên của bạn">
    </div>

    <div class="field">
      <label class="field-label">Email</label>
      <input class="field-input" type="email" formControlName="email" placeholder="you@email.com">
    </div>

    <div class="field">
      <label class="field-label">Tiêu đề</label>
      <input class="field-input" type="text" formControlName="subject" placeholder="Chủ đề (không bắt buộc)">
    </div>

    <div class="field">
      <label class="field-label">Nội dung</label>
      <textarea class="field-input field-textarea" formControlName="message" rows="5"
        placeholder="Lời nhắn của bạn..."></textarea>
    </div>

    <button class="contact-submit" type="submit" [disabled]="submitting">
      {{ submitting ? 'Đang gửi...' : 'Gửi liên hệ' }}
    </button>
  </form>
</main>

<app-footer></app-footer>
