<div class="admin-shell">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <span class="brand-name">Kuma Shop</span>
      <span class="admin-badge">ADMIN</span>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-link"
         routerLink="/admin/orders"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}">
        <i class="fa-solid fa-cart-shopping"></i>
        Orders
      </a>
      <a class="nav-link"
         routerLink="/admin/products"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}">
        <i class="fa-solid fa-tag"></i>
        Products
      </a>
      <a class="nav-link"
         routerLink="/admin/users"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}">
        <i class="fa-solid fa-user"></i>
        Customers
      </a>
      <a class="nav-link"
         routerLink="/admin/categories"
         routerLinkActive="active"
         [routerLinkActiveOptions]="{exact: false}">
        <i class="fa-solid fa-gear"></i>
        Settings
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="signout-link" (click)="logout()">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        Sign out
      </a>
    </div>
  </aside>

  <!-- Main area -->
  <div class="admin-main">
    <header class="admin-topbar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
        <input class="search-input" type="text" placeholder="Search orders, products, customers...">
      </div>
      <div class="topbar-right">
        <button class="notif-btn">
          <i class="fa-solid fa-bell"></i>
          <span class="notif-dot"></span>
        </button>
        <div class="user-chip">
          <div class="user-avatar">{{ getInitials() }}</div>
          <div class="user-meta">
            <span class="user-name">{{ userResponse?.fullname }}</span>
            <span class="user-role">{{ userResponse?.role?.name }}</span>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
